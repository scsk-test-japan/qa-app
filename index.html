<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>問題を解く</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text2: #8b8fa8;
    --success: #34d399;
    --error: #f87171;
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #ffffff10;
  }

  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 11px;
    color: var(--text2);
    margin-top: 1px;
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.bot  { align-items: flex-start; }

  .bubble {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.bot .bubble {
    background: var(--surface);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid #ffffff0a;
  }

  .msg img.thumb {
    max-width: 200px;
    border-radius: 12px;
    border: 2px solid var(--accent);
  }

  /* Typing indicator */
  .typing {
    display: flex; gap: 5px; align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    border: 1px solid #ffffff0a;
    width: fit-content;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--accent2);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Bottom controls */
  #controls {
    padding: 12px 16px 24px;
    background: var(--bg);
    border-top: 1px solid #ffffff10;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Preview */
  #preview-wrap {
    display: none;
    position: relative;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
  }
  #preview-wrap img {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
  }
  #remove-img {
    position: absolute;
    top: 8px; right: 8px;
    background: #000000aa;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    border: none;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); opacity: 0.85; }

  .btn-camera {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
  }

  .btn-gallery {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid #ffffff15;
  }

  .send-row {
    display: flex;
    gap: 8px;
  }

  #text-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid #ffffff15;
    border-radius: 14px;
    padding: 13px 15px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    line-height: 1.4;
  }
  #text-input::placeholder { color: var(--text2); }
  #text-input:focus { border-color: var(--accent); }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 14px;
    width: 50px;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  #send-btn:active { transform: scale(0.92); }
  #send-btn:disabled { opacity: 0.4; }

  /* Hidden inputs */
  #file-camera, #file-gallery { display: none; }

  /* Empty state */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text2);
    text-align: center;
    padding: 40px 20px;
  }
  .empty .icon { font-size: 48px; }
  .empty h2 { font-size: 18px; color: var(--text); font-weight: 700; }
  .empty p { font-size: 13px; line-height: 1.6; }

  /* API key setup */
  #setup {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
    z-index: 100;
  }
  #setup h2 { font-size: 22px; margin-bottom: 8px; }
  #setup p { color: var(--text2); font-size: 13px; margin-bottom: 24px; text-align: center; line-height: 1.6; }
  #api-key-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid #ffffff20;
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    margin-bottom: 12px;
    font-family: monospace;
  }
  #api-key-input:focus { border-color: var(--accent); }
  #save-key-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Setup screen (shown if no API key) -->
<div id="setup" style="display:none">
  <div style="font-size:48px;margin-bottom:16px">🔑</div>
  <h2>APIキーを設定</h2>
  <p>DifyのAPIキーを入力してください。<br>一度設定すれば次回から不要です。</p>
  <input id="api-key-input" type="text" placeholder="app-xxxxxxxxxxxxxxxx" />
  <button id="save-key-btn">保存して始める</button>
</div>

<header>
  <div class="logo">📚</div>
  <div>
    <h1>問題を解く</h1>
    <p>写真を撮って送るだけ</p>
  </div>
</header>

<div id="chat">
  <div class="empty" id="empty-state">
    <div class="icon">📷</div>
    <h2>問題を撮影しよう</h2>
    <p>下の「カメラで撮る」ボタンをタップして<br>問題文を写真に撮ってください。<br>すぐに解説します！</p>
  </div>
</div>

<div id="controls">
  <div id="preview-wrap">
    <img id="preview-img" src="" alt="preview">
    <button id="remove-img">✕</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-camera" id="camera-btn">
      📷 カメラで撮る
    </button>
    <button class="btn btn-gallery" id="gallery-btn">
      🖼 ギャラリー
    </button>
  </div>

  <div class="send-row">
    <textarea id="text-input" rows="1" placeholder="メッセージ（省略可）"></textarea>
    <button id="send-btn">↑</button>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="file-camera" accept="image/*" capture="environment">
<input type="file" id="file-gallery" accept="image/*">

<script>
const API_BASE = 'https://api.dify.ai/v1';
const STORAGE_KEY = 'dify_api_key';
const CONV_KEY = 'dify_conv_id';

let apiKey = '';
let conversationId = localStorage.getItem(CONV_KEY) || '';
let selectedFile = null;
let isWaiting = false;

// ── Init ──────────────────────────────────────────
function init() {
  apiKey = localStorage.getItem(STORAGE_KEY) || '';
  if (!apiKey) {
    // Use hardcoded key
    apiKey = 'app-FSREAPRQUhnuGyXqbHITYKhI';
    localStorage.setItem(STORAGE_KEY, apiKey);
  }
  document.getElementById('setup').style.display = 'none';
}

document.getElementById('save-key-btn').addEventListener('click', () => {
  const k = document.getElementById('api-key-input').value.trim();
  if (!k) return;
  localStorage.setItem(STORAGE_KEY, k);
  apiKey = k;
  document.getElementById('setup').style.display = 'none';
});

// ── Camera / Gallery ──────────────────────────────
document.getElementById('camera-btn').addEventListener('click', () => {
  document.getElementById('file-camera').click();
});
document.getElementById('gallery-btn').addEventListener('click', () => {
  document.getElementById('file-gallery').click();
});

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('preview-img').src = url;
  document.getElementById('preview-wrap').style.display = 'block';
  // Remove empty state
  document.getElementById('empty-state')?.remove();
}

document.getElementById('file-camera').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('file-gallery').addEventListener('change', e => handleFile(e.target.files[0]));

document.getElementById('remove-img').addEventListener('click', () => {
  selectedFile = null;
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('preview-img').src = '';
  document.getElementById('file-camera').value = '';
  document.getElementById('file-gallery').value = '';
});

// ── Auto-resize textarea ──────────────────────────
const ta = document.getElementById('text-input');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
});

// ── Send ──────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', send);
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 480) {
    e.preventDefault(); send();
  }
});

async function send() {
  if (isWaiting) return;
  const text = ta.value.trim() || '教えて';
  if (!selectedFile && !text) return;

  isWaiting = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('empty-state')?.remove();

  // Show user message
  const chat = document.getElementById('chat');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';

  if (selectedFile) {
    const imgEl = document.createElement('img');
    imgEl.className = 'thumb';
    imgEl.src = document.getElementById('preview-img').src;
    userMsg.appendChild(imgEl);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  userMsg.appendChild(bubble);
  chat.appendChild(userMsg);
  chat.scrollTop = chat.scrollHeight;

  // Clear inputs
  ta.value = '';
  ta.style.height = 'auto';
  const fileToSend = selectedFile;
  document.getElementById('remove-img').click();

  // Show typing
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg bot';
  typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    let fileId = null;

    // 1. Upload file if present
    if (fileToSend) {
      const form = new FormData();
      form.append('file', fileToSend, fileToSend.name || 'photo.jpg');
      form.append('user', 'user-001');

      const upRes = await fetch(`${API_BASE}/files/upload`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: form
      });
      const upData = await upRes.json();
      fileId = upData.id;
    }

    // 2. Send message
    const body = {
      inputs: {},
      query: text,
      response_mode: 'streaming',
      conversation_id: conversationId || '',
      user: 'user-001',
    };

    if (fileId) {
      body.files = [{
        type: 'image',
        transfer_method: 'local_file',
        upload_file_id: fileId
      }];
    }

    const res = await fetch(`${API_BASE}/chat-messages`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    // Remove typing
    typingDiv.remove();

    // Stream response
    const botMsg = document.createElement('div');
    botMsg.className = 'msg bot';
    const botBubble = document.createElement('div');
    botBubble.className = 'bubble';
    botBubble.textContent = '';
    botMsg.appendChild(botBubble);
    chat.appendChild(botMsg);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const json = line.slice(6);
        if (json === '[DONE]') continue;
        try {
          const obj = JSON.parse(json);
          if (obj.event === 'message' && obj.answer) {
            botBubble.textContent += obj.answer;
            chat.scrollTop = chat.scrollHeight;
          }
          if (obj.conversation_id) {
            conversationId = obj.conversation_id;
            localStorage.setItem(CONV_KEY, conversationId);
          }
        } catch {}
      }
    }

  } catch (err) {
    typingDiv.remove();
    const errMsg = document.createElement('div');
    errMsg.className = 'msg bot';
    errMsg.innerHTML = `<div class="bubble" style="color:var(--error)">エラーが発生しました。もう一度お試しください。<br><small>${err.message}</small></div>`;
    chat.appendChild(errMsg);
  }

  chat.scrollTop = chat.scrollHeight;
  isWaiting = false;
  document.getElementById('send-btn').disabled = false;
}

init();
</script>
</body>
</html>
