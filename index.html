<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>問題を解く</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text2: #8b8fa8;
    --error: #f87171;
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
    height: 100vh;
  }

  header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #ffffff10;
    flex-shrink: 0;
  }
  .logo {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header p { font-size: 11px; color: var(--text2); margin-top: 1px; }

  /* Chat */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .msg.user { align-items: flex-end; }
  .msg.bot  { align-items: flex-start; }
  .bubble {
    max-width: 85%; padding: 12px 15px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), #8b5cf6); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot  .bubble { background: var(--surface); color:var(--text); border-bottom-left-radius:4px; border:1px solid #ffffff0a; }
  .msg img.thumb { max-width:200px; border-radius:12px; border:2px solid var(--accent); }

  .typing { display:flex; gap:5px; align-items:center; padding:14px 16px; background:var(--surface); border-radius:var(--radius); border-bottom-left-radius:4px; border:1px solid #ffffff0a; width:fit-content; }
  .typing span { width:7px; height:7px; background:var(--accent2); border-radius:50%; animation:bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay:.2s; }
  .typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Controls */
  #controls { padding:10px 16px 20px; background:var(--bg); border-top:1px solid #ffffff10; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  #preview-wrap { display:none; position:relative; background:var(--surface); border-radius:12px; overflow:hidden; }
  #preview-wrap img { width:100%; max-height:160px; object-fit:cover; }
  #remove-img {
    position:absolute; top:8px; right:8px;
    background:#000000aa; color:#fff; border:none; border-radius:50%;
    width:28px; height:28px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #crop-btn-wrap {
    display:none;
    position:absolute; bottom:8px; right:8px;
  }
  #crop-btn {
    background: var(--accent); color:#fff; border:none; border-radius:10px;
    padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:4px;
  }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn {
    border:none; border-radius:14px; padding:13px 10px; font-size:14px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
    transition:opacity .15s, transform .1s; -webkit-tap-highlight-color:transparent;
  }
  .btn:active { transform:scale(0.96); opacity:.85; }
  .btn-camera { background:linear-gradient(135deg, var(--accent), #8b5cf6); color:#fff; }
  .btn-gallery { background:var(--surface2); color:var(--text); border:1px solid #ffffff15; }
  .send-row { display:flex; gap:8px; }
  #text-input {
    flex:1; background:var(--surface); border:1px solid #ffffff15; border-radius:14px;
    padding:12px 15px; color:var(--text); font-size:14px; outline:none;
    resize:none; font-family:inherit; line-height:1.4;
  }
  #text-input::placeholder { color:var(--text2); }
  #text-input:focus { border-color:var(--accent); }
  #send-btn {
    background:linear-gradient(135deg, var(--accent), #8b5cf6); color:#fff; border:none;
    border-radius:14px; width:50px; font-size:20px; cursor:pointer; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  #send-btn:disabled { opacity:.4; }
  #file-camera, #file-gallery { display:none; }

  .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text2); text-align:center; padding:40px 20px; }
  .empty .icon { font-size:48px; }
  .empty h2 { font-size:18px; color:var(--text); font-weight:700; }
  .empty p { font-size:13px; line-height:1.6; }

  /* ─── CROP OVERLAY ─────────────────────────────── */
  #crop-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    flex-direction: column;
  }
  #crop-overlay.active { display: flex; }

  #crop-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: #000;
    color: #fff;
  }
  #crop-topbar span { font-size: 15px; font-weight: 700; }
  #crop-cancel, #crop-done {
    border: none; background: none; font-size: 14px; font-weight: 700;
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
  }
  #crop-cancel { color: #aaa; }
  #crop-done { color: var(--accent2); }

  #crop-canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }
  #crop-bg {
    position: absolute; inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: brightness(0.4);
  }
  #crop-img {
    position: absolute;
    top: 0; left: 0;
    image-rendering: auto;
  }
  /* selection box */
  #crop-sel {
    position: absolute;
    border: 2px solid #fff;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    touch-action: none;
    cursor: move;
  }
  /* corner handles */
  .crop-handle {
    position: absolute;
    width: 22px; height: 22px;
    background: #fff;
    border-radius: 3px;
  }
  .crop-handle.tl { top:-2px; left:-2px; cursor:nw-resize; }
  .crop-handle.tr { top:-2px; right:-2px; cursor:ne-resize; }
  .crop-handle.bl { bottom:-2px; left:-2px; cursor:sw-resize; }
  .crop-handle.br { bottom:-2px; right:-2px; cursor:se-resize; }

  #crop-hint {
    text-align: center; padding: 10px; color: #888; font-size: 12px;
    background: #000;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📚</div>
  <div>
    <h1>問題を解く</h1>
    <p>写真を撮って送るだけ</p>
  </div>
</header>

<div id="chat">
  <div class="empty" id="empty-state">
    <div class="icon">📷</div>
    <h2>問題を撮影しよう</h2>
    <p>下の「カメラで撮る」をタップして<br>問題文を写真に撮ってください。<br>トリミングしてから送れます！</p>
  </div>
</div>

<div id="controls">
  <div id="preview-wrap">
    <img id="preview-img" src="" alt="preview">
    <button id="remove-img">✕</button>
    <div id="crop-btn-wrap">
      <button id="crop-btn">✂️ トリミング</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-camera" id="camera-btn">📷 カメラで撮る</button>
    <button class="btn btn-gallery" id="gallery-btn">🖼 ギャラリー</button>
  </div>
  <div class="send-row">
    <textarea id="text-input" rows="1" placeholder="メッセージ（省略可）"></textarea>
    <button id="send-btn">↑</button>
  </div>
</div>

<input type="file" id="file-camera" accept="image/*" capture="environment">
<input type="file" id="file-gallery" accept="image/*">

<!-- Crop Overlay -->
<div id="crop-overlay">
  <div id="crop-topbar">
    <button id="crop-cancel">キャンセル</button>
    <span>トリミング</span>
    <button id="crop-done">完了</button>
  </div>
  <div id="crop-canvas-wrap">
    <div id="crop-bg"></div>
    <img id="crop-img" src="" alt="">
    <div id="crop-sel">
      <div class="crop-handle tl" data-corner="tl"></div>
      <div class="crop-handle tr" data-corner="tr"></div>
      <div class="crop-handle bl" data-corner="bl"></div>
      <div class="crop-handle br" data-corner="br"></div>
    </div>
  </div>
  <div id="crop-hint">枠をドラッグして範囲を選択、角をドラッグしてサイズ変更</div>
</div>

<script>
const API_BASE   = 'https://api.dify.ai/v1';
const STORAGE_KEY = 'dify_api_key';
const CONV_KEY   = 'dify_conv_id';

let apiKey = 'app-FSREAPRQUhnuGyXqbHITYKhI';
let conversationId = localStorage.getItem(CONV_KEY) || '';
let selectedFile = null;
let isWaiting = false;
let originalImageSrc = null; // before crop

// ── Init ───────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) apiKey = saved;
  else localStorage.setItem(STORAGE_KEY, apiKey);
})();

// ── Camera / Gallery ───────────────────────────────
document.getElementById('camera-btn').addEventListener('click', () => document.getElementById('file-camera').click());
document.getElementById('gallery-btn').addEventListener('click', () => document.getElementById('file-gallery').click());

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  originalImageSrc = url;
  document.getElementById('preview-img').src = url;
  document.getElementById('preview-wrap').style.display = 'block';
  document.getElementById('crop-btn-wrap').style.display = 'block';
  document.getElementById('empty-state')?.remove();
}

document.getElementById('file-camera').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('file-gallery').addEventListener('change', e => handleFile(e.target.files[0]));

document.getElementById('remove-img').addEventListener('click', () => {
  selectedFile = null;
  originalImageSrc = null;
  document.getElementById('preview-wrap').style.display = 'none';
  document.getElementById('crop-btn-wrap').style.display = 'none';
  document.getElementById('preview-img').src = '';
  document.getElementById('file-camera').value = '';
  document.getElementById('file-gallery').value = '';
});

// ── Crop Logic ─────────────────────────────────────
let cropImg = document.getElementById('crop-img');
let cropSel = document.getElementById('crop-sel');
let cropWrap = document.getElementById('crop-canvas-wrap');

let imgRect = {}; // rendered image position/size within cropWrap
let sel = { x:0, y:0, w:0, h:0 }; // in screen px relative to imgRect

document.getElementById('crop-btn').addEventListener('click', openCrop);
document.getElementById('crop-cancel').addEventListener('click', closeCrop);
document.getElementById('crop-done').addEventListener('click', applyCrop);

function openCrop() {
  const overlay = document.getElementById('crop-overlay');
  const bg = document.getElementById('crop-bg');
  overlay.classList.add('active');
  bg.style.backgroundImage = `url(${originalImageSrc})`;
  cropImg.src = originalImageSrc;

  cropImg.onload = () => {
    layoutCropImage();
  };
  if (cropImg.complete) layoutCropImage();
}

function layoutCropImage() {
  const ww = cropWrap.clientWidth;
  const wh = cropWrap.clientHeight;
  const iw = cropImg.naturalWidth;
  const ih = cropImg.naturalHeight;

  const scale = Math.min(ww / iw, wh / ih);
  const rw = iw * scale;
  const rh = ih * scale;
  const rx = (ww - rw) / 2;
  const ry = (wh - rh) / 2;

  cropImg.style.width  = rw + 'px';
  cropImg.style.height = rh + 'px';
  cropImg.style.left   = rx + 'px';
  cropImg.style.top    = ry + 'px';

  imgRect = { x: rx, y: ry, w: rw, h: rh, iw, ih, scale };

  // Initial selection: full image
  sel = { x: rx, y: ry, w: rw, h: rh };
  applySel();
}

function applySel() {
  cropSel.style.left   = sel.x + 'px';
  cropSel.style.top    = sel.y + 'px';
  cropSel.style.width  = sel.w + 'px';
  cropSel.style.height = sel.h + 'px';
}

function clampSel() {
  const minSize = 30;
  sel.x = Math.max(imgRect.x, Math.min(sel.x, imgRect.x + imgRect.w - minSize));
  sel.y = Math.max(imgRect.y, Math.min(sel.y, imgRect.y + imgRect.h - minSize));
  sel.w = Math.max(minSize, Math.min(sel.w, imgRect.x + imgRect.w - sel.x));
  sel.h = Math.max(minSize, Math.min(sel.h, imgRect.y + imgRect.h - sel.y));
}

// Pointer events for move + resize
let dragState = null;

function getPointerPos(e) {
  const r = cropWrap.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

cropSel.addEventListener('pointerdown', startDrag);
cropSel.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

function startDrag(e) {
  e.stopPropagation();
  const corner = e.target.dataset.corner;
  const pos = getPointerPos(e);
  dragState = {
    type: corner ? 'resize' : 'move',
    corner,
    startPos: pos,
    startSel: { ...sel }
  };
  window.addEventListener('pointermove', onDrag);
  window.addEventListener('pointerup', endDrag);
}

function onDrag(e) {
  if (!dragState) return;
  const pos = getPointerPos(e);
  const dx = pos.x - dragState.startPos.x;
  const dy = pos.y - dragState.startPos.y;
  const s = dragState.startSel;

  if (dragState.type === 'move') {
    sel.x = s.x + dx;
    sel.y = s.y + dy;
    sel.w = s.w;
    sel.h = s.h;
  } else {
    const c = dragState.corner;
    if (c === 'tl') { sel.x = s.x+dx; sel.y = s.y+dy; sel.w = s.w-dx; sel.h = s.h-dy; }
    if (c === 'tr') { sel.y = s.y+dy; sel.w = s.w+dx; sel.h = s.h-dy; }
    if (c === 'bl') { sel.x = s.x+dx; sel.w = s.w-dx; sel.h = s.h+dy; }
    if (c === 'br') { sel.w = s.w+dx; sel.h = s.h+dy; }
  }
  clampSel();
  applySel();
}

function endDrag() {
  dragState = null;
  window.removeEventListener('pointermove', onDrag);
  window.removeEventListener('pointerup', endDrag);
}

function closeCrop() {
  document.getElementById('crop-overlay').classList.remove('active');
}

function applyCrop() {
  const { x, y, w, h, scale, iw, ih } = imgRect;

  // Convert screen coords to original image coords
  const sx = (sel.x - x) / scale;
  const sy = (sel.y - y) / scale;
  const sw = sel.w / scale;
  const sh = sel.h / scale;

  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(sw);
  canvas.height = Math.round(sh);
  const ctx = canvas.getContext('2d');

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, Math.round(sx), Math.round(sy), Math.round(sw), Math.round(sh), 0, 0, Math.round(sw), Math.round(sh));
    canvas.toBlob(blob => {
      selectedFile = new File([blob], 'cropped.jpg', { type: 'image/jpeg' });
      const url = URL.createObjectURL(blob);
      document.getElementById('preview-img').src = url;
      closeCrop();
    }, 'image/jpeg', 0.92);
  };
  img.src = originalImageSrc;
}

// ── Auto-resize textarea ───────────────────────────
const ta = document.getElementById('text-input');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
});

// ── Send ───────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', send);

async function send() {
  if (isWaiting) return;
  const text = ta.value.trim() || '教えて';
  if (!selectedFile && !text) return;

  isWaiting = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('empty-state')?.remove();

  const chat = document.getElementById('chat');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';

  if (selectedFile) {
    const imgEl = document.createElement('img');
    imgEl.className = 'thumb';
    imgEl.src = document.getElementById('preview-img').src;
    userMsg.appendChild(imgEl);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  userMsg.appendChild(bubble);
  chat.appendChild(userMsg);
  chat.scrollTop = chat.scrollHeight;

  ta.value = '';
  ta.style.height = 'auto';
  const fileToSend = selectedFile;
  document.getElementById('remove-img').click();

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg bot';
  typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    let fileId = null;
    if (fileToSend) {
      const form = new FormData();
      form.append('file', fileToSend, fileToSend.name || 'photo.jpg');
      form.append('user', 'user-001');
      const upRes = await fetch(`${API_BASE}/files/upload`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: form
      });
      const upData = await upRes.json();
      fileId = upData.id;
    }

    const body = {
      inputs: {}, query: text, response_mode: 'streaming',
      conversation_id: conversationId || '', user: 'user-001',
    };
    if (fileId) {
      body.files = [{ type:'image', transfer_method:'local_file', upload_file_id: fileId }];
    }

    const res = await fetch(`${API_BASE}/chat-messages`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const e = await res.json();
      throw new Error(e.message || `HTTP ${res.status}`);
    }

    // 全テキスト受信後にパース（モバイル回線でのタイムアウト対策）
    const rawText = await res.text();

    typingDiv.remove();
    const botMsg = document.createElement('div');
    botMsg.className = 'msg bot';
    const botBubble = document.createElement('div');
    botBubble.className = 'bubble';
    botMsg.appendChild(botBubble);
    chat.appendChild(botMsg);

    let fullAnswer = '';
    for (const line of rawText.split('\n')) {
      if (!line.startsWith('data: ')) continue;
      const js = line.slice(6).trim();
      if (!js || js === '[DONE]') continue;
      try {
        const obj = JSON.parse(js);
        if ((obj.event === 'message' || obj.event === 'agent_message') && obj.answer) {
          fullAnswer += obj.answer;
        }
        if (obj.conversation_id) {
          conversationId = obj.conversation_id;
          localStorage.setItem(CONV_KEY, obj.conversation_id);
        }
      } catch {}
    }

    if (fullAnswer) {
      botBubble.textContent = fullAnswer;
      chat.scrollTop = chat.scrollHeight;
    } else {
      botBubble.style.color = 'var(--error)';
      botBubble.textContent = '[デバッグ] 応答なし。受信データ先頭: ' + rawText.slice(0, 200);
    }

  } catch (err) {
    typingDiv.remove();
    const errMsg = document.createElement('div');
    errMsg.className = 'msg bot';
    errMsg.innerHTML = `<div class="bubble" style="color:var(--error)">エラー: ${err.message}</div>`;
    chat.appendChild(errMsg);
  }

  chat.scrollTop = chat.scrollHeight;
  isWaiting = false;
  document.getElementById('send-btn').disabled = false;
}
</script>
</body>
</html>
